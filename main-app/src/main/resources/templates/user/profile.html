<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile — StayEasy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="form-card">
        <h2>My Profile</h2>
        <p style="color:var(--text-light);margin-top:0">
            Username: <strong th:text="${user.username}">username</strong> &nbsp;|&nbsp;
            Role: <span class="badge"
                        th:classappend="${user.role.name() == 'ADMIN'} ? 'badge-admin' : (${user.role.name() == 'HOST'} ? 'badge-host' : 'badge-guest')"
                        th:text="${user.role}">GUEST</span>
        </p>

        <div class="alert alert-success" th:if="${param.updated}">Profile updated successfully.</div>

        <form th:action="@{/profile}" th:object="${profileDto}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" th:field="*{fullName}">
                <div class="error-text" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}">
                <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="form-group">
                <label for="phone">Phone (optional)</label>
                <input type="text" id="phone" th:field="*{phone}">
                <div class="error-text" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Save Changes</button>
        </form>
    </div>
</div>
</body>
</html>
