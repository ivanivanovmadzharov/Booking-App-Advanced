<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users — StayEasy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="page-header">
        <h1>Manage Users</h1>
        <a class="btn btn-secondary" th:href="@{/admin}">Back to Dashboard</a>
    </div>

    <div class="alert alert-success" th:if="${param.updated}">User role updated successfully.</div>

    <table>
        <thead>
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Full Name</th>
            <th>Current Role</th>
            <th>Change Role</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.username}">username</td>
            <td th:text="${user.email}">email</td>
            <td th:text="${user.fullName != null} ? ${user.fullName} : '—'">name</td>
            <td>
                <span class="badge"
                      th:classappend="${user.role.name() == 'ADMIN'} ? 'badge-admin' : (${user.role.name() == 'HOST'} ? 'badge-host' : 'badge-guest')"
                      th:text="${user.role}">GUEST</span>
            </td>
            <td>
                <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post"
                      style="display:flex;gap:0.5rem;align-items:center">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <select name="role" style="padding:0.3rem 0.5rem;border-radius:6px;border:1px solid var(--border)">
                        <option th:each="role : ${roles}"
                                th:value="${role}"
                                th:text="${role}"
                                th:selected="${role == user.role}">ROLE</option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-sm">Update</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
