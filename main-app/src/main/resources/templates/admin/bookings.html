<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Bookings — StayEasy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="page-header">
        <h1>All Bookings</h1>
        <a class="btn btn-secondary" th:href="@{/admin}">Back to Dashboard</a>
    </div>

    <div class="empty-state" th:if="${bookings.isEmpty()}">
        <p>No bookings in the system yet.</p>
    </div>

    <table th:unless="${bookings.isEmpty()}">
        <thead>
        <tr>
            <th>Guest</th>
            <th>Room</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="booking : ${bookings}">
            <td th:text="${booking.guest.username}">guest</td>
            <td th:text="${booking.room.title}">room</td>
            <td th:text="${booking.checkIn}">date</td>
            <td th:text="${booking.checkOut}">date</td>
            <td>$<span th:text="${booking.totalPrice}">0</span></td>
            <td>
                <span class="badge"
                      th:classappend="${booking.status.name() == 'CONFIRMED'} ? 'badge-confirmed' : (${booking.status.name() == 'CANCELLED'} ? 'badge-cancelled' : 'badge-pending')"
                      th:text="${booking.status}">Status</span>
            </td>
            <td>
                <form th:if="${booking.status.name() == 'CONFIRMED'}"
                      th:action="@{/admin/bookings/{id}/cancel(id=${booking.id})}" method="post"
                      onsubmit="return confirm('Cancel this booking?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-danger btn-sm">Cancel</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
