<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard — StayEasy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="page-header">
        <h1>Admin Dashboard</h1>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-number" th:text="${users.size()}">0</div>
            <div class="stat-label">Total Users</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" th:text="${totalRooms}">0</div>
            <div class="stat-label">Total Rooms</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" th:text="${totalBookings}">0</div>
            <div class="stat-label">Total Bookings</div>
        </div>
    </div>

    <div style="display:flex;gap:1rem">
        <a class="btn btn-primary" th:href="@{/admin/users}">Manage Users</a>
        <a class="btn btn-secondary" th:href="@{/admin/bookings}">View All Bookings</a>
    </div>
</div>
</body>
</html>
